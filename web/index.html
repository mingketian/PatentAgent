  <style>

<body class="min-h-screen bg-ink-50 dark:bg-ink-950 text-ink-900 dark:text-ink-100 transition-colors duration-300 font-body">

<header class="sticky top-0 z-40 border-b border-ink-200/70 dark:border-ink-800/60 glass-light">

<template x-if="page==='landing'">
<main>

      <div class="flex flex-wrap justify-center gap-3 animate-slide-up delay-2">
        <button @click="page='search'" class="lift group relative inline-flex items-center gap-2 px-7 py-3.5 bg-white text-ink-900 font-semibold rounded-xl shadow-glow-lg text-[14px] overflow-hidden">
          <span class="absolute inset-0 bg-gradient-to-r from-transparent via-brand-500/15 to-transparent shimmer-bg animate-shimmer opacity-0 group-hover:opacity-100 transition-opacity"></span>
          <svg class="relative w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>

<script>
function initPlexus(rootEl) {
  const canvas = rootEl.querySelector('#plexus-canvas');
  if (!canvas || canvas._plexusBooted) return;
  canvas._plexusBooted = true;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let particles = [];
  let mouse = { x: -9999, y: -9999, active: false };
  let rafId = null;
  const DENSITY = 0.000085, MIN_PARTICLES = 60, MAX_PARTICLES = 140;
  const MAX_DIST = 140, MOUSE_RADIUS = 180, SPEED = 0.25;

  function resize() {
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    if (W < 10 || H < 10) { setTimeout(resize, 80); return; }
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const target = Math.max(MIN_PARTICLES, Math.min(MAX_PARTICLES, Math.round(W * H * DENSITY)));
    if (particles.length === 0) {
      for (let i = 0; i < target; i++) particles.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*SPEED*2, vy: (Math.random()-0.5)*SPEED*2, r: Math.random()*1.4+0.6 });
    }
  }
  function step() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      if (mouse.active) { const dx = mouse.x - p.x, dy = mouse.y - p.y, d = Math.hypot(dx, dy); if (d < MOUSE_RADIUS && d > 0.1) { const f = (1-d/MOUSE_RADIUS)*0.6; p.x += (dx/d)*f; p.y += (dy/d)*f; } }
    }
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i+1; j < particles.length; j++) {
        const b = particles[j];
        const dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx+dy*dy;
        if (d2 < MAX_DIST*MAX_DIST) {
          const d = Math.sqrt(d2), alpha = (1-d/MAX_DIST)*0.55;
          ctx.strokeStyle = `rgba(167, 139, 250, ${alpha})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    if (mouse.active) {
      for (const p of particles) {
        const dx = mouse.x-p.x, dy = mouse.y-p.y, d2 = dx*dx+dy*dy;
        if (d2 < MOUSE_RADIUS*MOUSE_RADIUS) {
          const d = Math.sqrt(d2), alpha = (1-d/MOUSE_RADIUS)*0.75;
          ctx.strokeStyle = `rgba(216, 180, 254, ${alpha})`;
          ctx.lineWidth = 0.9;
          ctx.beginPath(); ctx.moveTo(mouse.x, mouse.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
      }
    }
    for (const p of particles) { ctx.fillStyle = 'rgba(221, 214, 254, 0.9)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
    rafId = requestAnimationFrame(step);
  }
  function start() { if (!rafId) step(); }
  function stop()  { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
  rootEl.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.active = true; });
  rootEl.addEventListener('mouseleave', () => { mouse.active = false; });
  const io = new IntersectionObserver(es => es.forEach(en => en.isIntersecting ? start() : stop()));
  io.observe(canvas);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  window.addEventListener('resize', resize);
  resize(); start();
}

function counter(target, duration) {
  return {
    value: 0,
    init() {
      const start = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3);
      const tick = (now) => { const t = Math.min(1, (now - start) / duration); this.value = target * ease(t); if (t < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    },
  };
}

function app() {
  return {
    page: 'landing',
    dark: false,
    status: { index_exists: false, patent_count: 0, embedding_model: '', openai_available: false },
    searchMode: 'optimized',
    topK: 3,
    useLLM: true,
    inputText: '',
    loading: false,
    loadingStageIdx: 0,
    loadingStage: 'Initializing',
    _loadingTimer: null,
    messages: [],
    sessionId: '',
    lastComparison: null,
    pipelineOpen: true,
    lastTrace: { has: false, stagesDone: 0, plan: null, rankedCount: 0, snippetCount: 0, topScore: null, verification: null },
    bmCases: [],
    bmCasePath: '',
    bmMethod: 'linear-patent-reranker',
    bmLoading: false,
    bmResult: null,
    bmError: '',

    benchmarkMetrics: [
      { label: 'Hit@1',    baseline: 0.590, ours: 0.600, deltaPct: '+1.7%' },
      { label: 'Hit@3',    baseline: 0.860, ours: 0.910, deltaPct: '+5.8%' },
      { label: 'Recall@3', baseline: 0.802, ours: 0.850, deltaPct: '+6.0%' },
      { label: 'Exact',    baseline: 0.470, ours: 0.510, deltaPct: '+8.5%' },
    ],

    pipeline: [
      { icon: '🔍', title: 'Vector Recall', desc: 'FAISS over 17.9K patents with PatentSBERTa', bar: 'from-blue-400 to-cyan-400' },
      { icon: '📊', title: 'Smart Rerank',  desc: 'Linear reranker: dense + BM25 + field-lexical', bar: 'from-violet-400 to-purple-400' },
      { icon: '🧠', title: 'Plan',          desc: 'Decide fresh search or reuse working set',     bar: 'from-amber-400 to-orange-400' },
      { icon: '📋', title: 'Evidence',      desc: 'Extract supporting snippets from each patent', bar: 'from-emerald-400 to-teal-400' },
      { icon: '💬', title: 'Ground',        desc: 'GPT-4o-mini generates an evidence-cited answer', bar: 'from-pink-400 to-rose-400' },
      { icon: '✅', title: 'Verify',        desc: 'Check the answer is supported by patent text', bar: 'from-teal-400 to-emerald-400' },
    ],

    examples: [
      { label: 'Vague Search', tag: 'Q2', group: 'Search', accent: 'bg-blue-500', chipClass: 'bg-blue-50 text-blue-700 dark:bg-blue-950/40 dark:text-blue-400', preview: 'Participant profiles and contextual information at physical gatherings', query: 'patents about participant profiles and contextual information at physical gatherings' },
      { label: 'Claim-style', tag: 'Q14', group: 'Search', accent: 'bg-indigo-500', chipClass: 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950/40 dark:text-indigo-400', preview: 'Specific dual-feature search: profile generation + contextual info requests', query: 'patents about participant profile generation and contextual information requests at physical gatherings' },
      { label: 'Similar Patent', tag: 'Q11', group: 'Search', accent: 'bg-violet-500', chipClass: 'bg-violet-50 text-violet-700 dark:bg-violet-950/40 dark:text-violet-400', preview: 'Find patents similar to a system presenting info from multiple data sources to event participants', query: 'find patents similar to systems and methods for presenting information extracted from one or more data sources to event participants' },
      { label: 'Follow-up', tag: 'Q3', group: 'Multi-turn', accent: 'bg-fuchsia-500', chipClass: 'bg-fuchsia-50 text-fuchsia-700 dark:bg-fuchsia-950/40 dark:text-fuchsia-400', preview: 'Which of those explicitly generates a profile for each participant at a physical gathering?', query: 'Which of those explicitly generates a profile for each participant at a physical gathering?' },
      { label: 'Comparison', tag: 'Q12', group: 'Multi-turn', accent: 'bg-pink-500', chipClass: 'bg-pink-50 text-pink-700 dark:bg-pink-950/40 dark:text-pink-400', preview: 'Compare the top two patents on profile generation and contextual delivery — evidence-based', query: 'Compare only the top two retrieved patents. For each patent, say whether the evidence supports participant profile generation and contextual information delivery. Then state which patent is stronger on each dimension. Use only the retrieved patents.' },
      { label: 'Combination', tag: 'Q17', group: 'Multi-turn', accent: 'bg-emerald-500', chipClass: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-400', preview: 'Combine invitation handling with attendee customization — single patent or split?', query: 'Using only the retrieved patents, if I combine invitation handling with attendee customization, does one retrieved patent clearly cover both features? If not, name the best patent for invitation handling and the best patent for attendee customization.' },
      { label: 'Out-of-domain', tag: 'Q20', group: 'Stress test', accent: 'bg-amber-500', chipClass: 'bg-amber-50 text-amber-700 dark:bg-amber-950/40 dark:text-amber-400', preview: 'CRISPR/LNP/IRD biotech landscape — should trigger insufficiency admission', query: 'Walk me through the patent landscape for non-viral in vivo CRISPR adenine and prime editing delivered by ionizable lipid nanoparticles for allele-specific inherited retinal degeneration. Organize the answer under separate headings for pegRNA architecture, pegRNA stabilization, deaminase engineering, PAM-relaxed Cas variants, tissue-specific promoter choice, photoreceptor targeting, Muller glia targeting, intravitreal dosing, subretinal dosing, repeat dosing, biodistribution modeling, bystander edit control, immune evasion, manufacturing release assays, CMC scale-up, orphan-drug exclusivity, partnering strategy, reimbursement strategy, and freedom-to-operate outlook, and if evidence is missing for a heading, say that directly.' },
    ],

    get exampleGroups() { const groups = {}; this.examples.forEach(ex => { (groups[ex.group] = groups[ex.group] || []).push(ex); }); return Object.keys(groups).map(name => ({ name, items: groups[name] })); },

    formatCount(n) { if (!n) return '—'; if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K patents'; return n + ' patents'; },

    async init() {
      try {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) this.dark = true;
        const saved = localStorage.getItem('pa-theme');
        if (saved === 'dark') this.dark = true;
        if (saved === 'light') this.dark = false;
      } catch(e) {}
      this.$watch && this.$watch('dark', v => { try { localStorage.setItem('pa-theme', v ? 'dark' : 'light'); } catch(e){} });
      this.sessionId = crypto.randomUUID();
      try { const r = await fetch('/api/health'); this.status = await r.json(); } catch(e){}
      try { const r = await fetch('/api/benchmark/cases'); const d = await r.json(); this.bmCases = d.cases || []; } catch(e){}
    },

    resetChat() { this.messages = []; this.lastComparison = null; this.lastTrace = { has: false, stagesDone: 0, plan: null, rankedCount: 0, snippetCount: 0, topScore: null, verification: null }; this.sessionId = crypto.randomUUID(); },

    switchMode(mode) { if (this.searchMode === mode) return; if (this.messages.length > 0 || this.loading) this.resetChat(); this.searchMode = mode; },

    _startLoadingAnimation() {
      this.loadingStageIdx = 0;
      this.loadingStage = this.pipeline[0].title;
      if (this._loadingTimer) clearInterval(this._loadingTimer);
      this._loadingTimer = setInterval(() => { if (this.loadingStageIdx < this.pipeline.length - 1) { this.loadingStageIdx++; this.loadingStage = this.pipeline[this.loadingStageIdx].title; } }, 700);
    },
    _stopLoadingAnimation() { if (this._loadingTimer) { clearInterval(this._loadingTimer); this._loadingTimer = null; } },

    _updateTrace(primary) { if (!primary) return; const top = primary.ranked && primary.ranked.length ? primary.ranked[0].score : null; this.lastTrace = { has: true, stagesDone: 6, plan: primary.plan || null, rankedCount: primary.ranked ? primary.ranked.length : 0, snippetCount: primary.snippets ? primary.snippets.length : 0, topScore: top, verification: primary.verification || null }; },

    async sendMessage() {
      const query = this.inputText.trim();
      if (!query || this.loading) return;
      this.inputText = '';
      this.messages.push({ role: 'user', content: query });
      this.loading = true;
      this._startLoadingAnimation();
      this.lastComparison = null;
      this.$nextTick(() => { if (this.$refs.chatScroll) this.$refs.chatScroll.scrollTop = this.$refs.chatScroll.scrollHeight; });
      try {
        const res = await fetch('/api/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variant: this.searchMode, top_k: this.topK, session_id: this.sessionId, use_llm_answer: this.useLLM, use_llm_planner: this.useLLM, use_llm_verification: this.useLLM }) });
        if (!res.ok) { const errText = await res.text().catch(() => res.statusText); this.messages.push({ role: 'assistant', content: `Server error (${res.status}): ${errText}` }); return; }
        const data = await res.json();
        if (data.session_id) this.sessionId = data.session_id;
        if (this.searchMode === 'comparison' && data.optimized && data.baseline) {
          this.messages.push({ role: 'assistant', content: 'Side-by-side comparison of Baseline RAG vs Our Optimized Agent.', _comparison: { baseline: data.baseline, optimized: data.optimized }, _showRanked: false, _showEvidence: false });
          this._updateTrace(data.optimized);
        } else {
          const primary = data.optimized || data.baseline;
          if (primary) { this.messages.push({ role: 'assistant', content: primary.answer, data: primary, _showRanked: true, _showEvidence: false }); this._updateTrace(primary); }
        }
      } catch(e) { this.messages.push({ role: 'assistant', content: 'Error: Could not reach the server.' }); }
      finally { this.loading = false; this._stopLoadingAnimation(); this.$nextTick(() => { if (this.$refs.chatScroll) this.$refs.chatScroll.scrollTop = this.$refs.chatScroll.scrollHeight; }); }
    },

    async runBenchmark() {
      if (!this.bmCasePath || this.bmLoading) return;
      this.bmLoading = true; this.bmResult = null; this.bmError = '';
      try {
        const res = await fetch('/api/benchmark/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ case_path: this.bmCasePath, method: this.bmMethod, top_k: this.topK }) });
        if (!res.ok) { this.bmError = `Server error (${res.status}): ${await res.text().catch(()=>res.statusText)}`; return; }
        this.bmResult = await res.json();
      } catch(e) { this.bmError = 'Could not reach the server.'; }
      finally { this.bmLoading = false; }
    },

    downloadReport() { if (!this.bmResult?.report) return; const blob = new Blob([this.bmResult.report], { type: 'text/markdown' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `patent_report_${this.bmResult.application_number || 'case'}.md`; a.click(); URL.revokeObjectURL(url); },
  };
}
</script>
